<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>microMap · Geometrie-Detail</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    body { background: #f3f1ea; color: #24343b; font: 15px/1.4 system-ui, sans-serif; }
    .panel { position: fixed; z-index: 2; left: 12px; top: 12px; width: min(340px, calc(100vw - 24px)); padding: 14px; border: 1px solid #0002; border-radius: 12px; background: #fffefbf2; box-shadow: 0 5px 24px #0002; backdrop-filter: blur(10px); }
    h1 { margin: 0 0 4px; font-size: 17px; }
    p { margin: 6px 0; }
    .subtle { color: #53646b; font-size: 13px; }
    .status { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #edf3f5; font-variant-numeric: tabular-nums; }
    .buttons { display: flex; gap: 8px; margin-top: 10px; }
    button, input { min-height: 44px; border: 1px solid #aebbc0; border-radius: 8px; background: #fff; color: inherit; font: inherit; }
    button { flex: 1; cursor: pointer; }
    input { width: 100%; margin-top: 5px; padding: 7px 9px; }
    button:focus-visible, input:focus-visible { outline: 3px solid #1769e0; outline-offset: 2px; }
    .attribution { position: fixed; z-index: 2; right: 8px; bottom: 7px; padding: 2px 5px; border-radius: 4px; background: #fffdf9d9; color: #33424a; font-size: 11px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <div id="map" aria-label="Interaktive Demo zur Geometrievereinfachung"></div>
  <section class="panel" aria-label="Demo-Steuerung">
    <h1>Geometrie-Detail</h1>
    <p class="subtle">Zoome heraus: Linien und Polygonringe werden geglättet. Zoome hinein: die Originalpräzision kehrt zurück.</p>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <p id="tile-error" class="subtle" role="status" aria-live="polite" hidden></p>
    <div class="buttons">
      <button id="overview" type="button">Übersicht</button>
      <button id="detail" type="button">Nahansicht</button>
    </div>
    <label class="subtle" for="tiles">Eigene MVT-Quelle (optional)</label>
    <input id="tiles" inputmode="url" placeholder="/tiles/{z}/{x}/{y}.mvt">
    <p class="subtle">Ohne Eingabe läuft eine eingebettete, netzwerkfreie Fixture. Für echte Bayern-Tiles: URL mit <code>?tiles=…</code> oder hier eintragen.</p>
  </section>
  <div class="attribution">microMap.js · Demo</div>
  <script src="../lib/microMap.min.js"></script>
  <script src="../lib/microMap.vector.min.js"></script>
  <script>
    (function () {
      var fixture = 'data:application/vnd.mapbox-vector-tile;base64,GjoKDnRyYW5zcG9ydGF0aW9uEhEIBxICAAAYAiIHCQAACoBAABoFY2xhc3MiCQoHcHJpbWFyeSiAIHgCGjsKCWxhbmRjb3ZlchIYCAcSAgAAGAMiDgkAABqAQAAAgED/PwAPGgVjbGFzcyIICgZmb3Jlc3QogCB4AhosCgVwbGFjZRIPCAcSAgAAGAEiBQmAQIBAGgVjbGFzcyIGCgR0b3duKIAgeAI=';
      var params = new URLSearchParams(location.search);
      var source = params.get('tiles') || fixture;
      var map = microMap('#map', { tiles: false, center: [0, 0], zoom: 8, minZoom: 0, maxZoom: 18, zoomAnimation: false, ariaLabel: 'Geometrievereinfachung' });
      var vectors = microMapVector(map, {
        tiles: source,
        minZoom: 0,
        maxZoom: 18,
        tileBuffer: 0,
        style: [
          { id: 'land', sourceLayer: 'landcover', type: 'fill', paint: { color: '#cfe3c4', opacity: 0.85 } },
          { id: 'roads', sourceLayer: 'transportation', type: 'line', lineCap: 'round', lineJoin: 'round', paint: { color: '#c28f4e', width: 2.2 } },
          { id: 'places', sourceLayer: 'place', type: 'symbol', minzoom: 5, layout: { 'text-field': ['get', 'name'], 'text-size': 14 }, paint: { 'text-color': '#33424a', 'text-halo-color': '#fffdf9', 'text-halo-width': 2 } }
        ]
      });
      var status = document.getElementById('status');
      var tileError = document.getElementById('tile-error');
      vectors.on('tileerror', function (event) {
        var detail = event && event.error && event.error.message ? ': ' + event.error.message : '.';
        tileError.textContent = 'MVT-Kachel konnte nicht geladen werden' + detail;
        tileError.hidden = false;
      });
      vectors.on('tileload', function () { tileError.hidden = true; });
      function update() {
        var zoom = map.getZoom();
        var mode = zoom < 8 ? 'stark geglättet' : zoom < 12 ? 'leicht geglättet' : 'Originalpräzision';
        status.textContent = 'Zoom ' + zoom.toFixed(1) + ' · ' + mode;
      }
      map.on('zoom', update).on('move', update);
      document.getElementById('overview').onclick = function () { map.setView([0, 0], 5); };
      document.getElementById('detail').onclick = function () { map.setView([0, 0], 14); };
      document.getElementById('tiles').value = params.get('tiles') || '';
      document.getElementById('tiles').addEventListener('change', function (event) {
        var next = event.target.value.trim();
        if (next) {
          tileError.hidden = true;
          vectors.setTiles(next);
        }
      });
      update();
    }());
  </script>
</body>
</html>
